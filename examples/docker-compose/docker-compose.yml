# Full stack end-to-end demo of the ch-jwt-verify sidecar pattern.
#
# Wire:
#   browser → Superset (FAB OAuth via Dex)
#     → Superset captures the OAuth access_token (JWT) on login
#     → SQL Lab → Superset sends ClickHouse `Authorization: Basic
#                   base64(email:JWT)` via clickhouse-connect
#     → CH http_authentication backend calls ch-jwt-verify /verify
#         → sidecar validates iss + aud + exp + email_verified + JWKS
#         → 200 ⇒ CH runs the query as the named user
#
# Run:
#   ./up.sh             # compose up -d --wait
#   ./run-tests.sh      # automated curl path
#   ./down.sh           # compose down -v

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready -d dex` confirms both that the server is up AND that
      # init SQL has created the dex database. Dex hangs at startup if
      # the database isn't there yet.
      test: ["CMD-SHELL", "pg_isready -U postgres -d dex && pg_isready -U postgres -d superset"]
      interval: 3s
      timeout: 3s
      retries: 30

  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:5556/dex/.well-known/openid-configuration"]
      interval: 3s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    restart: unless-stopped
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
    depends_on:
      ch-jwt-verify:
        # Strictly speaking CH can come up first — its http_authentication
        # backend is only contacted on the first user query. But making
        # the order explicit keeps the log timeline easier to read.
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  ch-jwt-verify:
    build:
      context: ../..
      dockerfile: examples/docker-compose/ch-jwt-verify/Dockerfile
    restart: unless-stopped
    command: ["--config", "/etc/ch-jwt-verify/config.yaml", "--log-level", "debug"]
    volumes:
      - ./ch-jwt-verify/config.yaml:/etc/ch-jwt-verify/config.yaml:ro
    ports:
      - "9999:9999"
    depends_on:
      dex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9999/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30

  superset-init:
    image: altinity-oauth-helper-example-superset:local
    build:
      context: ./superset
      dockerfile: Dockerfile
    restart: "no"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://superset:superset@postgres:5432/superset
      DEX_CLIENT_ID: superset
      DEX_CLIENT_SECRET: supersetsecret
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@superset.local}
      PYTHONPATH: /app/pythonpath
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/init.sh:/init.sh:ro
    entrypoint: ["/bin/bash", "/init.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  superset:
    image: altinity-oauth-helper-example-superset:local
    build:
      context: ./superset
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://superset:superset@postgres:5432/superset
      DEX_CLIENT_ID: superset
      DEX_CLIENT_SECRET: supersetsecret
      # Browser-facing Dex URL — what the user sees in the redirect bar.
      DEX_PUBLIC_URL: http://localhost:5556/dex
      # Container-facing Dex URL — token exchange + /userinfo run from
      # the Superset pod's network namespace.
      DEX_INTERNAL_URL: http://dex:5556/dex
      PYTHONPATH: /app/pythonpath
      SUPERSET_LOG_LEVEL: INFO
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    ports:
      - "8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
      dex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/health"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  postgres-data:
  clickhouse-data:
