# Superset overlay on top of ../../_platform/docker/compose.yml.
#
# Adds two services on top of the shared data plane:
#   superset-init   — one-shot: provisions the superset DB+user in
#                     Postgres, runs `superset db upgrade`, seeds the
#                     ClickHouse (oauth) connection.
#   superset        — the web app, depends_on superset-init completing.
#
# `include:` is what makes the layering work: paths in each included
# file are anchored to that file's directory. With plain `-f file1 -f
# file2`, every path resolves from the first file's directory, which
# breaks bind mounts to consumer-local configs.
#
# Run via ./up.sh (or `docker compose up -d`).

include:
  - ../../_platform/docker/compose.yml

services:
  superset-init:
    image: altinity-oauth-helper-example-superset:local
    build:
      context: ./superset
      dockerfile: Dockerfile
    restart: "no"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://superset:superset@postgres:5432/superset
      # Postgres admin creds used by init.sh to create the superset
      # user/database — the platform's `_platform/docker/postgres/`
      # init scripts only create the dex DB; consumers bootstrap their
      # own metadata DBs.
      POSTGRES_ADMIN_USER: postgres
      POSTGRES_ADMIN_PASSWORD: postgres
      DEX_CLIENT_ID: superset
      DEX_CLIENT_SECRET: supersetsecret
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@superset.local}
      PYTHONPATH: /app/pythonpath
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/init.sh:/init.sh:ro
    entrypoint: ["/bin/bash", "/init.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  superset:
    image: altinity-oauth-helper-example-superset:local
    build:
      context: ./superset
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://superset:superset@postgres:5432/superset
      DEX_CLIENT_ID: superset
      DEX_CLIENT_SECRET: supersetsecret
      # Browser-facing Dex URL — what the user sees in the redirect bar.
      DEX_PUBLIC_URL: http://localhost:5556/dex
      # Container-facing Dex URL — token exchange + /userinfo run from
      # the Superset pod's network namespace.
      DEX_INTERNAL_URL: http://dex:5556/dex
      PYTHONPATH: /app/pythonpath
      SUPERSET_LOG_LEVEL: INFO
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    ports:
      - "8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
      dex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/health"]
      interval: 5s
      timeout: 5s
      retries: 60
