# integration/clickhouse/ha/haproxy.cfg
#
# HAProxy TCP frontend for the phase-5 Docker HA fixture (issue #19 phase 5,
# plan §16). Fronts two independently-running `ch-oauth-ldap` replicas
# (ch-oauth-ldap-a, ch-oauth-ldap-b) on the SAME hostname/port
# (`ch-oauth-ldap:389`) that the unchanged `clickhouse/common/config.d/ldap.xml`
# already points at — ClickHouse itself never learns HA is happening.
#
# This is a pure L4 (mode tcp) proxy: LDAP simple-Bind is a stateful binary
# protocol over one TCP connection, so there is no HTTP-layer routing to do
# and no reason to terminate/re-encode the protocol. Every design choice
# below exists to support the two claims the HA runner (run-ha.sh) proves
# live: (1) backend health is observed mechanically via the runtime stats
# socket, never inferred from a fixed sleep; (2) a killed backend's existing
# connections fail immediately and are never silently migrated to the
# survivor (see run-ha.sh's persistent session-probe flow).
#
# Image: pinned by DIGEST (never a floating tag) in compose-ha.yml AND in
# run-ha.sh's generated sandbox-fallback template — both must reference the
# IDENTICAL digest (see tests/cases/ha-fallback-parity.sh). Resolved once at
# implementation time via `docker buildx imagetools inspect haproxy:lts-alpine`
# against the `haproxy:lts-alpine` tag the coordinator approved; re-resolve
# and re-pin deliberately (never silently) if that lineage is ever
# intentionally bumped.
#
# The Docker Official haproxy image already runs as its own unprivileged
# `haproxy` user (uid/gid 99) and already includes `socat` — no image
# customization, no root workaround, and no separate health-check sidecar
# is needed (see run-ha.sh's rootless-port preflight, which fails the whole
# fixture outright, before waiting on health, if this container's own
# /proc/sys/net/ipv4/ip_unprivileged_port_start forbids an unprivileged
# bind to :389).

global
    log stdout format raw local0
    # Runtime stats socket under /var/lib/haproxy (the image's own haproxy
    # user already owns this directory — see Dockerfile-less image
    # inspection in the phase-5 plan). "level admin" is required for `show
    # stat` to also report per-server check state fields the runner parses;
    # this socket is never published to any published port and is only ever
    # reached via `compose exec` inside this same container, so exposing
    # admin-level control on it carries no additional external attack
    # surface.
    stats socket /var/lib/haproxy/haproxy.sock mode 660 level admin

defaults
    mode tcp
    log global
    option tcplog
    # Finite bounds everywhere — see plan §16.3. A stuck/half-open TCP
    # connection (either direction) must eventually be reaped rather than
    # pinning a backend slot forever.
    timeout connect 2s
    timeout client 35s
    timeout server 35s
    timeout check 2s

# Docker's embedded per-network DNS resolver. Required for backend
# hostnames to be re-resolved AFTER startup: helper A is deliberately
# destroyed and recreated during the HA proof (run-ha.sh), so a
# startup-only DNS lookup would keep routing traffic at the OLD, now-dead
# address forever. hold/retry bounds are finite so a resolution failure is
# eventually surfaced rather than retried indefinitely.
#
# Docker's embedded DNS (127.0.0.11) stops answering for a container's name
# the moment that container's network endpoint is torn down — which happens
# on a plain `docker kill`/stop, not only on `docker rm` — so a SHORT
# `hold nx`/`hold other` would make HAProxy give up on the name within a
# second or two and flip the server to "MAINT (resolution)" (a DNS-outage
# state) rather than "DOWN" (a health-check-failure state). Verified live
# against this exact config+image: with a 2s hold, killing a backend
# produced MAINT (resolution) before the run-ha.sh mechanical gate (`show
# stat` requiring plain DOWN) could observe it. Holding the last-known-good
# address for a generous window (comfortably longer than
# `fall * check inter` = 2 * 500ms = 1s) instead lets the TCP health check
# against that now-unreachable stale address fail on its own merits first —
# the actually-desired, more specific "DOWN" state — and only falls back to
# a DNS-outage MAINT state if resolution stays broken far longer than this
# fixture's own bounded test windows ever run.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 30s
    hold refused 30s
    hold nx 30s
    hold timeout 30s
    hold obsolete 30s

# The runner's `show stat` health gate (run-ha.sh) requires this exact
# backend name ("ldap_back") and both server names below — see
# haproxy_backend_status() there.
frontend ldap_front
    bind :389
    default_backend ldap_back

backend ldap_back
    balance roundrobin
    option tcp-check
    tcp-check connect
    # init-addr last,none: never trust a baked-in/cached address across a
    # backend recreation; resolve-prefer ipv4 keeps this deterministic on a
    # dual-stack Docker network. Health parameters match plan §16.3's
    # committed bounds exactly (inter 500ms, fall 2, rise 2).
    default-server resolvers docker init-addr last,none resolve-prefer ipv4 check inter 500ms fall 2 rise 2
    server ch-oauth-ldap-a ch-oauth-ldap-a:389
    server ch-oauth-ldap-b ch-oauth-ldap-b:389
