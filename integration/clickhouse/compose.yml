# integration/clickhouse/compose.yml
#
# Phase-3 real-ClickHouse integration fixture (issue #19). Four services,
# two Docker networks, only two loopback host ports published. See the
# phase-3 plan ("Exact service topology") for the full rationale; in short:
#
#   auth-net:    synthetic-idp, ch-oauth-ldap, clickhouse-origin
#   cluster-net: clickhouse-origin, clickhouse-remote
#
# clickhouse-remote is deliberately NOT on auth-net: it must have no route
# to the synthetic IdP or the LDAP helper (see "Why the remote node has the
# LDAP directory but not helper connectivity" in the plan) — that is what
# makes acceptance scenario H's "remote never re-authenticates the JWT"
# proof possible.
#
# Do not run this file directly with a bare `docker compose up`. run.sh
# owns per-run secret generation, the mechanical health gate, RBAC/data
# bootstrap, the scenario-A preflight, and teardown; invoking this compose
# file on its own skips all of that.
#
# The two ClickHouse services' image is PHASE3_CH_IMAGE (env, defaulted
# below to the issue's pinned 24.8 baseline) rather than a bare literal, so
# run-all-builds.sh can drive the same fixture against every build
# lib/expectations.sh has recorded per-build behavioral expectations for
# (see that file, and scenarios/70-distributed-propagation.sh /
# scenarios/75-distributed-propagation-view.sh, for why more than one build
# matters here). run.sh writes PHASE3_CH_IMAGE into its own private
# --env-file for this substitution to resolve; run.sh's sandbox-fallback
# compose template (bring_up_fixture_fallback) reads the same shell
# variable directly instead, since that template is generated by run.sh's
# own printf calls, not read by `docker compose` as a file on disk.

services:
  synthetic-idp:
    build:
      context: ../..
      dockerfile: integration/clickhouse/Dockerfile
    image: altinity-oauth-helper-phase3-helper:local
    command: ["/bin/synthetic-idp"]
    environment:
      ISSUER: http://synthetic-idp/
      AUDIENCE: clickhouse
      LISTEN: :80
    networks:
      - auth-net
    ports:
      - "127.0.0.1:${PHASE3_IDP_PORT:-18080}:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 2s
      timeout: 2s
      retries: 60

  ch-oauth-ldap:
    build:
      context: ../..
      dockerfile: integration/clickhouse/Dockerfile
    image: altinity-oauth-helper-phase3-helper:local
    command: ["/bin/ch-oauth-ldap", "--config", "/etc/ch-oauth-ldap/config.yaml"]
    volumes:
      - ./helper/config.yaml:/etc/ch-oauth-ldap/config.yaml:ro
    networks:
      - auth-net
    depends_on:
      synthetic-idp:
        condition: service_healthy
    healthcheck:
      # ch-oauth-ldap has no HTTP endpoint; this intentionally proves only
      # that the LDAP listener accepts TCP (see "Mechanically defined
      # service readiness" in the plan). Authentication correctness is
      # proved through ClickHouse in the scenario checks, not here.
      test: ["CMD", "nc", "-z", "127.0.0.1", "389"]
      interval: 2s
      timeout: 2s
      retries: 60

  clickhouse-origin:
    image: ${PHASE3_CH_IMAGE:-altinity/clickhouse-server:24.8.11.51285.altinitystable}
    volumes:
      - ./clickhouse/common/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/common/users.d:/etc/clickhouse-server/users.d:ro
    environment:
      PHASE3_CLUSTER_SECRET: ${PHASE3_CLUSTER_SECRET:?PHASE3_CLUSTER_SECRET must be set by run.sh (never invoke this compose file directly)}
    networks:
      - auth-net
      - cluster-net
    ports:
      - "127.0.0.1:${PHASE3_CH_HTTP_PORT:-18123}:8123"
    depends_on:
      ch-oauth-ldap:
        condition: service_healthy
      synthetic-idp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 60

  clickhouse-remote:
    image: ${PHASE3_CH_IMAGE:-altinity/clickhouse-server:24.8.11.51285.altinitystable}
    volumes:
      - ./clickhouse/common/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/common/users.d:/etc/clickhouse-server/users.d:ro
    environment:
      PHASE3_CLUSTER_SECRET: ${PHASE3_CLUSTER_SECRET:?PHASE3_CLUSTER_SECRET must be set by run.sh (never invoke this compose file directly)}
    # Deliberately no ports:, and deliberately not on auth-net.
    networks:
      - cluster-net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 60

networks:
  # Explicit, run-scoped literal names (rather than the compose-default
  # <project>_<network> form) so `docker network inspect` output in the
  # scenario-A preflight is deterministic and greppable, and so this
  # fixture's networks can't collide by name with unrelated networks a
  # shared Docker host might have.
  auth-net:
    name: ch-phase3-auth-net
  cluster-net:
    name: ch-phase3-cluster-net
