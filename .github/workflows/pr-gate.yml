name: PR gate

on:
  # If a merge queue is ever enabled on `main`, a `merge_group:` trigger must be
  # added here as well: without it the required `Required PR gate` context is
  # never reported for a queue entry, so entries stall forever. That fails
  # closed, but it presents as an outage rather than as a misconfiguration.
  # Do not add the trigger before a queue actually exists.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required-pr-gate:
    name: Required PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Race tests
        run: go test -race ./...

      - name: Phase 5 security tests
        run: go test -tags phase5release ./internal/securitytest -count=1

      - name: ClickHouse shell library tests
        run: bash integration/clickhouse/tests/lib-tests.sh
