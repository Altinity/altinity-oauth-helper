name: PR gate

on:
  # If a merge queue is ever enabled on `main`, a `merge_group:` trigger must be
  # added here as well: without it the required `Required PR gate` context is
  # never reported for a queue entry, so entries stall forever. That fails
  # closed, but it presents as an outage rather than as a misconfiguration.
  # Do not add the trigger before a queue actually exists.
  #
  # `types` must include `edited`, not just the opened/synchronize/reopened
  # default: a base-branch retarget is delivered as an `edited` activity, not
  # a new `synchronize`, and keeps the same head SHA. Without `edited` here, a
  # PR proven green against base A can be retargeted onto protected `main` and
  # keep that same green required check without the new merge result ever
  # being tested — GitHub's required-check rule falls back to the head SHA's
  # existing check when the test-merge commit has none of its own. Do not
  # special-case skip title/body-only edits to "optimize" this back down —
  # that reopens the exact gap this closes.
  #
  # Known limit of that protection: events produced with the repository's own
  # `GITHUB_TOKEN` do not start new workflow runs (GitHub's recursion
  # guard). So `edited` closes the retarget gap only for base changes made by
  # a human or by an actor whose events actually trigger Actions. No
  # repository automation may retarget a pull request's base with
  # `GITHUB_TOKEN` unless it also produces a real `synchronize` (or otherwise
  # forces a fresh gate run) — `strict: true` branch protection narrows the
  # reachable cases but is not a complete substitute, since an unchanged head
  # can already be up to date with the newly selected base. This constraint
  # is external to this file and deliberately has no contract test: a YAML
  # check cannot observe it. If automated retargeting ever becomes a real
  # requirement, revisit the enforcement mechanism rather than assuming this
  # trigger covers it.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required-pr-gate:
    name: Required PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Race tests
        run: go test -race ./...

      - name: Phase 5 security tests
        run: go test -tags phase5release ./internal/securitytest -count=1

      - name: ClickHouse shell library tests
        run: bash integration/clickhouse/tests/lib-tests.sh
